<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact Form — Dark UI (Blue)</title>
  <!-- Fonts (Poppins) -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />

  <style>
    :root {
      --brand: #0894E2;         /* Primary blue */
      --bg: #1f2631;            /* page background */
      --panel: #2a323d;         /* form card background */
      --text: #e7edf5;          /* main text color */
      --muted: #aeb6c2;         /* muted text */
      --input: #202733;         /* input background */
      --input-border: #3a4452;  /* input border */
      --shadow: 0 8px 32px rgba(0,0,0,0.35);
      --radius: 14px;
    }

    *{box-sizing:border-box}
    html,body{height:100%}
    body{margin:0;background:var(--bg);color:var(--text);font-family:"Poppins",system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,"Helvetica Neue",Arial,"Noto Sans",sans-serif}
    a{color:inherit;text-decoration:none}

    /* ===== Layout ===== */
    .contact{max-width:1280px;margin:48px auto;padding:0 20px} /* ➜ rộng hơn */
    /* widen right column more */
    .contact__wrap{display:grid;grid-template-columns:0.85fr 1.6fr;gap:32px;align-items:stretch}

    /* Left info column */
    .info{background:transparent; /* no background */
          border-radius:var(--radius);padding:40px;box-shadow:none;position:relative;margin-left:-12px;z-index:0}
    .info__title{font-size:40px;line-height:1.15;font-weight:800;margin:0 0 14px;white-space:nowrap}
    .info__lead{color:var(--muted);font-size:15px;line-height:1.7;margin:0 0 28px;max-width:50ch}

    .info__item{display:flex;align-items:center;gap:14px;margin:18px 0}
    /* Icon box + visible FA glyph */
    .info__icon{width:44px;height:44px;display:grid;place-items:center;border-radius:12px;
                color:var(--brand);border:1px solid rgba(8,148,226,.55);background:rgba(8,148,226,.08);
                box-shadow:0 6px 22px rgba(8,148,226,.22);z-index:1}
    .info .fa-solid{font-family:"Font Awesome 6 Free";font-weight:900} /* bảo đảm hiển thị glyph */

    .info__label{font-weight:700;color:var(--brand)} /* label in brand blue */
    .info__text{display:flex;flex-direction:column}
    .info__text small{color:var(--muted);font-weight:500}

    /* Right form panel */
    .form{background:var(--panel);border-radius:var(--radius);padding:28px 28px 34px;box-shadow:var(--shadow)}
    .form__title{font-size:32px;text-align:center;margin:4px 0 18px}
    .form__title strong{color:var(--brand)}

    .form__grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}

    .field{position:relative}
    .input, .textarea{width:100%;border:1px solid var(--input-border);background:var(--input);color:var(--text);border-radius:10px;padding:14px 14px;font-size:14px;outline:none;transition:border .2s, box-shadow .2s}
    .textarea{min-height:210px;resize:vertical}
    .input::placeholder, .textarea::placeholder{color:#8d99a8}
    .input:focus, .textarea:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(8,148,226,.2)}

    .form__full{grid-column:1/-1}

    .btn{display:inline-flex;justify-content:center;align-items:center;width:188px; /* giữ nhỏ hơn */
         padding:14px 22px;border-radius:999px;background:var(--brand);color:#092235;font-weight:700;
         box-shadow:0 10px 30px rgba(8,148,226,.45), inset 0 -2px 0 rgba(0,0,0,.15);border:none;cursor:pointer;transition:transform .12s ease, filter .2s ease}
    .btn:hover{filter:brightness(1.05)}
    .btn:active{transform:translateY(1px)}

    .form__actions{display:flex;justify-content:center;margin-top:10px}

    /* ===== Responsive ===== */
    @media (max-width: 1024px){
      .contact{max-width:100%}
      .contact__wrap{grid-template-columns:1fr}
      .info{order:2;margin-left:0;padding:28px}
      .form{order:1}
    }
  </style>
</head>
<body>
  <section class="contact" aria-label="Contact Section">
    <div class="contact__wrap">
      <!-- Left column: CTA + contact details -->
      <aside class="info">
        <h2 class="info__title">Let's Work Together</h2>
        <p class="info__lead">Có dự án đang ấp ủ? Hãy liên hệ để cùng phân tích yêu cầu, đề xuất giải pháp và bắt đầu triển khai nhanh nhất có thể.</p>

        <div class="info__item">
          <div class="info__icon" aria-hidden="true"><i class="fa-solid fa-phone"></i></div>
          <div class="info__text">
            <span class="info__label">Phone</span>
            <small>(+12) 345 678 910</small>
          </div>
        </div>

        <div class="info__item">
          <div class="info__icon" aria-hidden="true"><i class="fa-solid fa-envelope"></i></div>
          <div class="info__text">
            <span class="info__label">Email</span>
            <small>youremail@gmail.com</small>
          </div>
        </div>

        <div class="info__item">
          <div class="info__icon" aria-hidden="true"><i class="fa-solid fa-location-dot"></i></div>
          <div class="info__text">
            <span class="info__label">Address</span>
            <small>123 Anywhere Street, Any City</small>
          </div>
        </div>
      </aside>

      <!-- Right column: Form -->
      <form class="form" action="#" method="post" novalidate>
        <h3 class="form__title">Contact <strong>Me!</strong></h3>

        <div class="form__grid">
          <div class="field"><input class="input" type="text" name="full_name" placeholder="Full Name" required></div>
          <div class="field"><input class="input" type="email" name="email" placeholder="Email Address" required></div>
          <div class="field"><input class="input" type="tel" name="phone" placeholder="Phone Number"></div>
          <div class="field"><input class="input" type="text" name="subject" placeholder="Email Subject"></div>
          <div class="field form__full"><textarea class="textarea" name="message" placeholder="Your Message"></textarea></div>
        </div>

        <div class="form__actions">
          <button class="btn" type="submit">Send Message</button>
        </div>
      </form>
    </div>
  </section>
</body>
</html>
