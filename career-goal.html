<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mục tiêu nghề nghiệp</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" xintegrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />

    <style>
        /* CSS Reset and Basic Setup */
        :root {
            --font-heading: 'Montserrat', sans-serif;
            --font-body: 'Source Sans 3', sans-serif;
            --color-dark-blue: #2c3e50;
            --color-text-primary: #34495e;
            --color-text-secondary: #7f8c8d;
            --color-background: #ffffff;
            --color-icon-bg-initial: #ecf0f1;
            --color-details-bg: #ffffff;

            --goal1-color: #3498db;
            --goal2-color: #8e44ad; /* Changed from blue */
            --goal3-color: #1abc9c;
            --goal4-color: #e67e22;
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-body);
            background-color: #f4f7f6;
            color: var(--color-text-primary);
            line-height: 1.6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 2rem;
        }

        /* Main Container */
        .goals-infographic {
            width: 100%;
            max-width: 1200px;
            background-color: #1F1F22;
            border-radius: 16px;
            padding: 2rem;
            box-shadow: 0 10px 30px rgba(0,0,0,0.07);
        }

        /* Header */
        .goals-infographic__header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .goals-infographic__title {
            font-family: var(--font-heading);
            font-size: 2.5rem;
            color: #ffffff;
            text-transform: uppercase;
        }

        .goals-infographic__subtitle {
            font-size: 1.1rem;
            color: #e0f7fa;
            max-width: 500px;
            margin: 0.5rem auto 0;
        }

        /* Main Content Area - Grid */
        .goals-infographic__content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            align-items: center;
            gap: 2rem;
        }

        /* Circular Layout Container */
        .goals-circular-layout {
            position: relative;
            width: 100%;
            max-width: 600px;
            aspect-ratio: 1 / 1;
            margin: 2rem auto;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .goals-circular-layout::before {
            content: '';
            position: absolute;
            width: 90%; 
            height: 90%;
            border: 3px dashed #EA285B;
            border-radius: 50%;
            z-index: 5;
            transform: scale(0);
            opacity: 0;
            transition: transform 1s cubic-bezier(0.68, -0.55, 0.27, 1.55), opacity 1s ease-out;
        }
        
        .goals-circular-layout.is-active::before {
            transform: scale(1);
            opacity: 1;
        }

        .goals-infographic__target-graphic {
            position: relative;
            z-index: 1;
        }
        
        .target-image {
            width: 100%;
            max-width: 250px;
            height: auto;
        }

        .timeline-item {
            position: absolute;
            z-index: 10;
            opacity: 0;
            transition: opacity 0.5s ease-out, transform 0.5s ease-out;
        }
        
        .timeline-item__icon-wrapper {
            width: 76px; height: 76px;
            border-radius: 50%;
            display: flex; justify-content: center; align-items: center;
            background-color: white;
            padding: 4px;
            z-index: 15;
            cursor: pointer;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .timeline-item.is-selected .timeline-item__icon-wrapper {
            transform: scale(1.15);
            box-shadow: 0 8px 25px rgba(0,0,0,0.15);
        }
        
        .timeline-item__icon-wrapper > div {
            width: 100%; height: 100%; border-radius: 50%;
            display: flex; justify-content: center; align-items: center;
            background-color: var(--color-icon-bg-initial);
            transition: background-color 0.5s ease-in-out;
        }

        .timeline-item__icon {
            font-size: 2rem;
            color: var(--color-dark-blue);
            transition: color 0.5s ease-in-out;
        }
        
        /* Positioning icons on the circle */
        .timeline-item--goal1 { top: 5%; left: 50%; transform: translate(-50%, -50%) scale(0.5); }
        .timeline-item--goal2 { top: 50%; left: 95%; transform: translate(-50%, -50%) scale(0.5); }
        .timeline-item--goal3 { top: 95%; left: 50%; transform: translate(-50%, -50%) scale(0.5); }
        .timeline-item--goal4 { top: 50%; left: 5%; transform: translate(-50%, -50%) scale(0.5); }
        
        .goals-circular-layout.is-active .timeline-item { opacity: 1; }
        .goals-circular-layout.is-active .timeline-item--goal1 { transform: translate(-50%, -50%) scale(1); transition-delay: 0.3s; }
        .goals-circular-layout.is-active .timeline-item--goal2 { transform: translate(-50%, -50%) scale(1); transition-delay: 0.5s; }
        .goals-circular-layout.is-active .timeline-item--goal3 { transform: translate(-50%, -50%) scale(1); transition-delay: 0.7s; }
        .goals-circular-layout.is-active .timeline-item--goal4 { transform: translate(-50%, -50%) scale(1); transition-delay: 0.9s; }
        
        .goals-circular-layout.is-active .timeline-item__icon-wrapper--goal1 > div, .timeline-item--goal1.is-selected .timeline-item__icon-wrapper > div { background-color: var(--goal1-color); }
        .goals-circular-layout.is-active .timeline-item__icon-wrapper--goal2 > div, .timeline-item--goal2.is-selected .timeline-item__icon-wrapper > div { background-color: var(--goal2-color); }
        .goals-circular-layout.is-active .timeline-item__icon-wrapper--goal3 > div, .timeline-item--goal3.is-selected .timeline-item__icon-wrapper > div { background-color: var(--goal3-color); }
        .goals-circular-layout.is-active .timeline-item__icon-wrapper--goal4 > div, .timeline-item--goal4.is-selected .timeline-item__icon-wrapper > div { background-color: var(--goal4-color); }
        
        .goals-circular-layout.is-active .timeline-item__icon, .timeline-item.is-selected .timeline-item__icon { color: white; }

        /* Goal Details Box */
        .goal-details {
            background-color: var(--color-details-bg);
            border-radius: 12px;
            padding: 2rem;
            height: 100%;
            min-height: 450px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            border-top: 5px solid transparent;
            box-shadow: 0 10px 30px rgba(0,0,0,0.07);
            transition: border-top-color 0.4s ease;
        }
        .goal-details__content {
            opacity: 1;
            transition: opacity 0.4s ease-in-out;
        }
        .goal-details__content.is-changing {
            opacity: 0;
        }
        .goal-details__image {
            width: 100%;
            height: auto;
            aspect-ratio: 16 / 9;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 1.5rem;
        }
        .goal-details__title {
            font-family: var(--font-heading);
            font-size: 1.75rem;
            color: var(--color-dark-blue);
            margin-bottom: 1rem;
        }
        .goal-details__description {
            font-size: 1.1rem;
            line-height: 1.7;
            color: var(--color-text-secondary);
        }
        .goal-details__placeholder {
            text-align: center;
            color: var(--color-text-secondary);
        }
        .goal-details__placeholder i {
            color: #ced4da;
            margin-bottom: 1rem;
        }


        /* Responsive Design */
        @media (max-width: 950px) {
            .goals-infographic__content { grid-template-columns: 1fr; }
            .goal-details { min-height: auto; margin-top: 2rem; padding: 1.5rem; text-align: center; }
            .goals-circular-layout { max-width: 500px; }
        }
        @media (max-width: 500px) {
            body { padding: 1rem; }
            .goals-infographic { padding: 1rem; }
            .goals-infographic__title { font-size: 2rem; }
            .goals-circular-layout, .goal-details { display: none; }

            .mobile-goals-list { display: block; width: 100%; }
            .mobile-goal-item {
                display: flex; align-items: flex-start;
                margin-bottom: 2rem;
                opacity: 0; transform: translateY(20px);
                transition: opacity 0.5s ease-out, transform 0.5s ease-out;
            }
            .mobile-goal-item.is-active { opacity: 1; transform: translateY(0); }
            .mobile-goal-item .timeline-item__icon-wrapper { margin-right: 1.5rem; }
            .mobile-goal-item__title { font-family: var(--font-heading); font-size: 1.25rem; margin-bottom: 0.25rem; }
            .mobile-goal-item__description { color: var(--color-text-secondary); }
        }
         @media (min-width: 501px) {
            .mobile-goals-list { display: none; }
        }

    </style>
</head>
<body>

    <main class="goals-infographic">
        <header class="goals-infographic__header">
            <h1 class="goals-infographic__title">Mục tiêu nghề nghiệp</h1>
            <p class="goals-infographic__subtitle">4 mục tiêu quan trọng trong hành trình sự nghiệp của tôi.</p>
        </header>

        <div class="goals-infographic__content">
            <div class="goals-circular-layout">
                <div class="goals-infographic__target-graphic">
                    <img src="https://placehold.co/400x400/e67e22/ffffff?text=Mục+Tiêu" alt="Bia mục tiêu" class="target-image">
                </div>
                
                <article class="timeline-item timeline-item--goal1" data-color="var(--goal1-color)" data-title="IELTS Academic 7.5" data-description="Đạt chứng chỉ IELTS 7.5 để đáp ứng điều kiện ngôn ngữ đầu vào cho chương trình Thạc sĩ tại Đức và hỗ trợ đọc tài liệu chuyên ngành IT bằng tiếng Anh." data-image="https://images.unsplash.com/photo-1455849318743-b2233052fcff?q=80&w=2070&auto=format&fit=crop">
                    <div class="timeline-item__icon-wrapper timeline-item__icon-wrapper--goal1">
                        <div><i class="fas fa-graduation-cap timeline-item__icon"></i></div>
                    </div>
                </article>

                <article class="timeline-item timeline-item--goal2" data-color="var(--goal2-color)" data-title="Du học Master tại Đức" data-description="Hoàn thành chương trình Thạc sĩ Khoa học Máy tính để nâng cao kiến thức chuyên môn và trải nghiệm môi trường quốc tế." data-image="https://images.unsplash.com/photo-1528732228303-015242551a8f?q=80&w=1974&auto=format&fit=crop">
                    <div class="timeline-item__icon-wrapper timeline-item__icon-wrapper--goal2">
                          <div><i class="fas fa-plane-departure timeline-item__icon"></i></div>
                    </div>
                </article>

                <article class="timeline-item timeline-item--goal3" data-color="var(--goal3-color)" data-title="Senior Software Engineer" data-description="Tích lũy kinh nghiệm, đảm nhận các dự án phức tạp để đạt được vị trí Kỹ sư Phần mềm Cấp cao." data-image="https://images.unsplash.com/photo-1542831371-29b0f74f9713?q=80&w=2070&auto=format&fit=crop">
                    <div class="timeline-item__icon-wrapper timeline-item__icon-wrapper--goal3">
                        <div><i class="fas fa-user-tie timeline-item__icon"></i></div>
                    </div>
                </article>

                <article class="timeline-item timeline-item--goal4" data-color="var(--goal4-color)" data-title="Team Lead" data-description="Phát triển kỹ năng lãnh đạo, quản lý và định hướng kỹ thuật để dẫn dắt một đội ngũ lập trình viên." data-image="https://images.unsplash.com/photo-1572021335469-31706a17aaef?q=80&w=2070&auto=format&fit=crop">
                    <div class="timeline-item__icon-wrapper timeline-item__icon-wrapper--goal4">
                        <div><i class="fas fa-users timeline-item__icon"></i></div>
                    </div>
                </article>
            </div>

            <aside class="goal-details">
                <div class="goal-details__content">
                    <div class="goal-details__placeholder">
                        <i class="fas fa-hand-pointer fa-3x"></i>
                        <p style="margin-top: 1rem;">Nhấp vào một mục tiêu để xem chi tiết</p>
                    </div>
                    <!-- The card content will be populated here by JavaScript -->
                    <img src="" alt="" class="goal-details__image" style="display: none;">
                    <h3 class="goal-details__title" style="display: none;"></h3>
                    <p class="goal-details__description" style="display: none;"></p>
                </div>
            </aside>

            <!-- This is the list for mobile view -->
            <div class="mobile-goals-list"></div>
        </div>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const circularLayout = document.querySelector('.goals-circular-layout');
            const timelineItems = document.querySelectorAll('.timeline-item');
            const detailsBox = document.querySelector('.goal-details');
            const detailsContent = detailsBox.querySelector('.goal-details__content');
            const placeholder = detailsBox.querySelector('.goal-details__placeholder');
            const detailsImage = detailsBox.querySelector('.goal-details__image');
            const detailsTitle = detailsBox.querySelector('.goal-details__title');
            const detailsDesc = detailsBox.querySelector('.goal-details__description');

            let selectedGoal = null;

            const updateDetails = (item) => {
                const title = item ? item.dataset.title : '';
                const description = item ? item.dataset.description : '';
                const color = item ? '#EA285B' : 'transparent';
                const imageSrc = item ? item.dataset.image : '';

                detailsContent.classList.add('is-changing');
                
                setTimeout(() => {
                    if (item) {
                        placeholder.style.display = 'none';
                        detailsImage.style.display = 'block';
                        detailsTitle.style.display = 'block';
                        detailsDesc.style.display = 'block';

                        detailsImage.src = imageSrc;
                        detailsImage.alt = title;
                        detailsTitle.textContent = title;
                        detailsDesc.textContent = description;
                    } else {
                        placeholder.style.display = 'block';
                        detailsImage.style.display = 'none';
                        detailsTitle.style.display = 'none';
                        detailsDesc.style.display = 'none';
                    }
                    detailsBox.style.borderTopColor = color;
                    detailsContent.classList.remove('is-changing');
                }, 200);
            };

            timelineItems.forEach(item => {
                item.addEventListener('click', () => {
                    if (selectedGoal === item) {
                        // Deselect
                        selectedGoal.classList.remove('is-selected');
                        selectedGoal = null;
                        updateDetails(null);
                    } else {
                        // Select new
                        if (selectedGoal) {
                            selectedGoal.classList.remove('is-selected');
                        }
                        selectedGoal = item;
                        selectedGoal.classList.add('is-selected');
                        updateDetails(selectedGoal);
                    }
                });
            });

            // --- Initial Animation ---
            const layoutObserver = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        circularLayout.classList.add('is-active');
                        layoutObserver.unobserve(entry.target);
                    }
                });
            }, { rootMargin: '0px 0px -25% 0px' });
            if (circularLayout) layoutObserver.observe(circularLayout);
            
            // --- Mobile Fallback ---
            const mobileListContainer = document.querySelector('.mobile-goals-list');
            if (mobileListContainer && window.innerWidth <= 500) {
                const goalsData = Array.from(timelineItems).map(item => ({
                    title: item.dataset.title,
                    description: item.dataset.description,
                    icon: item.querySelector('.timeline-item__icon').cloneNode(true),
                    colorClass: item.querySelector('.timeline-item__icon-wrapper').classList[1] 
                }));

                goalsData.forEach(goal => {
                    const itemEl = document.createElement('div');
                    itemEl.className = 'mobile-goal-item';
                    itemEl.innerHTML = `<div class="timeline-item__icon-wrapper ${goal.colorClass}"><div></div></div><div><h3 class="mobile-goal-item__title">${goal.title}</h3><p class="mobile-goal-item__description">${goal.description}</p></div>`;
                    itemEl.querySelector('.timeline-item__icon-wrapper > div').appendChild(goal.icon);
                    mobileListContainer.appendChild(itemEl);
                });
                
                const mobileItems = document.querySelectorAll('.mobile-goal-item');
                const mobileObserver = new IntersectionObserver((entries) => {
                    entries.forEach((entry, index) => {
                        if(entry.isIntersecting) {
                            setTimeout(() => {
                                entry.target.classList.add('is-active');
                                const iconWrapper = entry.target.querySelector('.timeline-item__icon-wrapper > div');
                                const icon = entry.target.querySelector('.timeline-item__icon');
                                if (iconWrapper.parentElement.classList.contains('timeline-item__icon-wrapper--goal1')) iconWrapper.style.backgroundColor = 'var(--goal1-color)';
                                if (iconWrapper.parentElement.classList.contains('timeline-item__icon-wrapper--goal2')) iconWrapper.style.backgroundColor = 'var(--goal2-color)';
                                if (iconWrapper.parentElement.classList.contains('timeline-item__icon-wrapper--goal3')) iconWrapper.style.backgroundColor = 'var(--goal3-color)';
                                if (iconWrapper.parentElement.classList.contains('timeline-item__icon-wrapper--goal4')) iconWrapper.style.backgroundColor = 'var(--goal4-color)';
                                icon.style.color = 'white';
                            }, index * 200);
                        }
                    });
                }, { threshold: 0.1 });
                
                mobileItems.forEach(item => mobileObserver.observe(item));
            }

        });
    </script>
</body>
</html>
