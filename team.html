<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Testimonial Slider - Reusable (<template> + Data)</title>

  <!-- Google Fonts: Montserrat and Source Sans 3 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />

  <!-- Swiper CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />

  <style>
    :root {
      --blue: #0894E2;           /* xanh cho arrows/pagination/icon */
      --ring-gray: #9CA3AF;      /* xám cho viền avatar */
      --dark-card: #1F1F22;      /* nền card đen */
      --text-strong: #e5e7eb;    /* chữ trên nền tối */
      --text-muted: #a1a1aa;
      --card-shadow: 0 10px 25px rgba(0, 0, 0, 0.25);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Source Sans 3', sans-serif;
      background-color: #f0f2f5;
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      color: var(--text-muted);
      line-height: 1.6; overflow-x: hidden;
    }

    .container { width: 100%; max-width: 1200px; padding: 20px; }

    /* Swiper */
    .swiper { width: 100%; padding-top: 50px; padding-bottom: 24px; overflow: visible; }
    .swiper-slide { display: flex; justify-content: center; }

    /* Card */
    .card { background-color: var(--dark-card); border-radius: 24px; box-shadow: var(--card-shadow); width: 320px; text-align: center; overflow: visible; position: relative; transition: transform .3s ease, box-shadow .3s ease; }
    .card:hover { transform: translateY(-5px); box-shadow: 0 18px 36px rgba(0,0,0,.35); }
    .swiper-slide-active .card { transform: translateY(-15px); box-shadow: 0 18px 36px rgba(0,0,0,.4); }
    .swiper-slide-active .card:hover { transform: translateY(-20px); }

    .card__header { background: url('https://images.unsplash.com/photo-1503264116251-35a269479413?q=80&w=1200&auto=format&fit=crop') center/cover no-repeat; height: 140px; border-radius: 24px 24px 0 0; position: relative; }

    .card__avatar { width: 130px; height: 130px; border-radius: 50%; object-fit: cover; position: absolute; bottom: -65px; left: 50%; transform: translateX(-50%);
      /* Hai viền xám mỏng nhất có thể (1px), khoảng giữa là nền đen */
      box-shadow:
        0 0 0 1px var(--ring-gray),   /* vòng trong xám 1px */
        0 0 0 3px var(--dark-card),   /* khoảng giữa đen nhỏ gọn */
        0 0 0 4px var(--ring-gray);   /* vòng ngoài xám 1px */
    }

    .card__body { padding: 85px 30px 30px; }
    .card__name { font-family: 'Montserrat', sans-serif; color: var(--text-strong); font-size: 22px; margin-bottom: 8px; font-weight: 700; }
    .card__description { font-size: 16px; margin-bottom: 24px; color: var(--text-strong); opacity: .9; }

    .card__actions { display: flex; gap: 12px; justify-content: center; }
    .card__icon-btn { width: 44px; height: 44px; border-radius: 12px; display: inline-flex; align-items: center; justify-content: center; background: var(--dark-card); border: 1px solid var(--blue); color: var(--blue); text-decoration: none; transition: transform .2s ease, box-shadow .2s ease, background .3s ease, color .3s ease, border-color .3s ease; }
    .card__icon-btn i { font-size: 18px; }
    .card__icon-btn:hover { transform: translateY(-2px); background: linear-gradient(135deg, #0894E2, #68baf0); color: #ffffff; border-color: transparent; box-shadow: 0 10px 24px rgba(8, 148, 226, .35); }

    /* Centered Controls: arrows flank pagination with EXACT 2px spacing */
    .swiper-controls { display: flex; align-items: center; justify-content: center; gap: 0; margin-top: 12px; }
    .swiper-controls .swiper-button-prev,
    .swiper-controls .swiper-button-next { position: static; inset: auto; transform: none; color: var(--blue); width: 40px; height: 40px; border-radius: 999px; display: inline-flex; align-items: center; justify-content: center; background: #ffffff; border: 1px solid var(--blue); box-shadow: 0 4px 12px rgba(0,0,0,.06); cursor: pointer; }
    .swiper-controls .swiper-button-prev:hover,
    .swiper-controls .swiper-button-next:hover { background: #f0f9ff; }
    .swiper-controls .swiper-button-prev::after,
    .swiper-controls .swiper-button-next::after { display: none; }
    .swiper-controls .swiper-nav-icon { font-size: 18px; }

    /* enforce 2px between arrows and pagination only */
    .swiper-controls .swiper-button-prev { margin-right: 2px; }
    .swiper-controls .swiper-pagination { position: static !important; margin: 0 2px; }
    .swiper-controls .swiper-button-next { margin-left: 2px; }

    .swiper-controls .swiper-pagination-bullet { width: 10px; height: 10px; background-color: #d1d5db; opacity: 1; }
    .swiper-controls .swiper-pagination-bullet-active { background-color: var(--blue); }

    /* Hide the default pagination inside .swiper */
    .swiper .swiper-pagination { display: none; }
  </style>
</head>
<body>
  <div class="container">

    <!-- 1) TEMPLATE FOR A SLIDE (keeps exact UI) -->
    <template id="slide-template">
      <div class="swiper-slide">
        <div class="card">
          <div class="card__header">
            <img class="card__avatar" alt="" onerror="this.onerror=null;this.src='https://placehold.co/130x130/EFEFEF/333333?text=User';">
          </div>
          <div class="card__body">
            <h3 class="card__name"></h3>
            <p class="card__description"></p>
            <div class="card__actions">
              <a class="card__icon-btn" target="_blank" rel="noopener" aria-label="GitHub" title="GitHub"><i class="fa-brands fa-github"></i></a>
              <a class="card__icon-btn" target="_blank" rel="noopener" aria-label="Website" title="Website"><i class="fa-solid fa-globe"></i></a>
            </div>
          </div>
        </div>
      </div>
    </template>

    <!-- 2) SWIPER HOST -->
    <div class="swiper">
      <div class="swiper-wrapper" id="slides-host"></div>
      <div class="swiper-pagination"></div> <!-- hidden by CSS (we use external one) -->
    </div>

    <!-- 3) EXTERNAL CONTROLS: prev [2px] pagination [2px] next -->
    <div class="swiper-controls">
      <button class="swiper-button-prev" type="button" aria-label="Slide trước"><i class="fa-solid fa-chevron-left swiper-nav-icon" aria-hidden="true"></i></button>
      <div class="swiper-pagination"></div>
      <button class="swiper-button-next" type="button" aria-label="Slide sau"><i class="fa-solid fa-chevron-right swiper-nav-icon" aria-hidden="true"></i></button>
    </div>
  </div>

  <!-- Swiper JS -->
  <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>

  <!-- 4) DATA + RENDER LOGIC (reusable) -->
  <script>
    // a) Dữ liệu có thể lấy từ API/JSON; ví dụ giữ nguyên 4 item cũ
    const testimonials = [
      {
        name: 'David Dell',
        desc: 'The lorem text the section that contains header with having open functionality. Lorem dolor sit amet consectetur adipisicing elit.',
        avatar: 'https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?q=80&w=300&auto=format&fit=crop',
        github: '#',
        website: '#'
      },
      {
        name: 'Rose Bush',
        desc: 'The lorem text the section that contains header with having open functionality. Lorem dolor sit amet consectetur adipisicing elit.',
        avatar: 'https://images.unsplash.com/photo-1438761681033-6461ffad8d80?q=80&w=300&auto=format&fit=crop',
        github: '#',
        website: '#'
      },
      {
        name: 'Jones Gail',
        desc: 'The lorem text the section that contains header with having open functionality. Lorem dolor sit amet consectetur adipisicing elit.',
        avatar: 'https://images.unsplash.com/photo-1500648767791-00dcc994a43e?q=80&w=300&auto=format&fit=crop',
        github: '#',
        website: '#'
      },
      {
        name: 'Maria Smantha',
        desc: 'The lorem text the section that contains header with having open functionality. Lorem dolor sit amet consectetur adipisicing elit.',
        avatar: 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?q=80&w=300&auto=format&fit=crop',
        github: '#',
        website: '#'
      }
    ];

    // b) Hàm render 1 slide từ template (có thể tái sử dụng)
    function renderSlide(item) {
      const tpl = document.getElementById('slide-template');
      const node = tpl.content.cloneNode(true);
      node.querySelector('.card__avatar').src = item.avatar;
      node.querySelector('.card__avatar').alt = `Ảnh đại diện của ${item.name}`;
      node.querySelector('.card__name').textContent = item.name;
      node.querySelector('.card__description').textContent = item.desc;
      const [gh, web] = node.querySelectorAll('.card__icon-btn');
      gh.href = item.github || '#';
      web.href = item.website || '#';
      return node;
    }

    // c) Mount tất cả slides
    const host = document.getElementById('slides-host');
    testimonials.forEach(item => host.appendChild(renderSlide(item)));

    // d) Khởi tạo Swiper sau khi render xong
    const swiper = new Swiper('.swiper', {
      loop: false,
      slidesPerView: 1,
      spaceBetween: 7,
      centeredSlides: true,
      grabCursor: true,
      pagination: { el: '.swiper-controls .swiper-pagination', clickable: true },
      navigation: { nextEl: '.swiper-controls .swiper-button-next', prevEl: '.swiper-controls .swiper-button-prev' },
      breakpoints: {
        768: { slidesPerView: 2, spaceBetween: 7 },
        1024: { slidesPerView: 3, spaceBetween: 7 }
      }
    });

    // e) API tái sử dụng: bạn có thể cập nhật dữ liệu động
    window.TestimonialSlider = {
      setItems(items) {
        host.innerHTML = '';
        items.forEach(item => host.appendChild(renderSlide(item)));
        swiper.update();
      },
      addItem(item) {
        host.appendChild(renderSlide(item));
        swiper.update();
      }
    };
  </script>
</body>
</html>
