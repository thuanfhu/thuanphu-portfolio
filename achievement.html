<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dòng Thời Gian Thành Tích</title>
    
    <!-- Google Fonts --><link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;900&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
    
    <!-- Font Awesome for Icons --><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        :root {
            --bg-color: #1F1F22;
            --primary-red: #EA285B;
            --primary-blue: #0894E2;
            --text-light: #f0f0f0;
            --text-dark: #A0A0A0;
            --card-bg: #2a2a2e;
            --timeline-line-color: #555;
            --font-heading: 'Montserrat', sans-serif;
            --font-body: 'Source Sans 3', sans-serif;
        }

        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-light);
            font-family: var(--font-body);
            min-height: 100vh;
            overflow-x: hidden;
            padding: 50px 20px;
        }

        .container {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            text-align: center;
        }

        .main-title {
            font-family: var(--font-heading);
            font-size: 3.5rem;
            font-weight: 900;
            margin-bottom: 80px;
            background: linear-gradient(90deg, var(--primary-red), var(--primary-blue));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            opacity: 0;
            animation: fadeInDown 1s ease-out forwards, text-glow 2s ease-in-out infinite alternate;
            animation-delay: 0s, 1s;
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        @keyframes text-glow {
            from { text-shadow: 0 0 5px var(--primary-red), 0 0 10px var(--primary-blue); }
            to { text-shadow: 0 0 10px var(--primary-red), 0 0 20px var(--primary-blue); }
        }

        /* Bố cục Timeline */
        .timeline-container {
            position: relative;
        }

        .timeline-grid {
            display: grid;
            grid-template-columns: 1fr 150px 1fr; /* Left Card | Gutter | Right Card */
            gap: 50px 40px; /* Increased column gap */
            width: 100%;
            align-items: center;
        }
        
        .timeline-item {
            opacity: 0;
            transform: scale(0.9) translateY(20px);
            transition: opacity 0.6s ease-out, transform 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .timeline-item.left {
            grid-column: 1 / 2;
            text-align: right;
        }
        .timeline-item.right {
            grid-column: 3 / 4;
            text-align: left;
        }
        .timeline-item:nth-child(1) { grid-row: 1; }
        .timeline-item:nth-child(2) { grid-row: 2; }
        .timeline-item:nth-child(3) { grid-row: 3; }
        .timeline-item:nth-child(4) { grid-row: 4; }
        
        .timeline-item.is-visible {
            opacity: 1;
            transform: scale(1) translateY(0);
        }

        .timeline-svg-wrapper {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1; 
            pointer-events: none;
        }

        .timeline-svg {
            width: 100%;
            height: 100%;
            overflow: visible;
        }

        #timeline-path {
            stroke: var(--timeline-line-color);
            stroke-width: 4;
            fill: none;
            stroke-linecap: round;
        }
        
        .timeline-node {
            position: absolute;
            width: 20px;
            height: 20px;
            background-color: var(--bg-color);
            border: 4px solid var(--timeline-line-color);
            border-radius: 50%;
            z-index: 1;
            transition: border-color 0.5s ease-in-out, transform 0.5s ease-in-out;
        }
        .timeline-node.active.node-red { border-color: var(--primary-red); transform: scale(1.2); }
        .timeline-node.active.node-blue { border-color: var(--primary-blue); transform: scale(1.2); }

        .achievement-card {
            background-color: var(--card-bg);
            border-radius: 16px;
            text-align: left;
            border: 1px solid #333;
            position: relative;
            overflow: hidden;
            display: inline-block;
            max-width: 450px;
            width: 100%;
            transition: transform 0.4s cubic-bezier(0.25, 0.8, 0.25, 1), 
                        box-shadow 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
        }
        
        .achievement-card:hover { transform: perspective(1000px) rotateX(5deg) rotateY(-5deg) scale(1.05); }
        .timeline-item.right .achievement-card:hover { transform: perspective(1000px) rotateX(5deg) rotateY(5deg) scale(1.05); }
        .card-red:hover { box-shadow: 0 20px 40px rgba(0,0,0,0.6), 0 0 35px rgba(234, 40, 91, 0.5); }
        .card-blue:hover { box-shadow: 0 20px 40px rgba(0,0,0,0.6), 0 0 35px rgba(8, 148, 226, 0.5); }

        .card-image-wrapper { position: relative; }
        .card-image {
            width: 100%;
            height: 180px;
            object-fit: cover;
            border-top-left-radius: 16px;
            border-top-right-radius: 16px;
            transition: transform 0.5s ease;
        }
        .achievement-card:hover .card-image { transform: scale(1.1); }
        
        .preview-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            background-color: rgba(0,0,0,0.6);
            color: white;
            border: none;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            font-size: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background-color 0.3s, transform 0.3s;
            backdrop-filter: blur(5px);
        }
        .preview-btn:hover { background-color: rgba(0,0,0,0.8); transform: scale(1.1); }
        
        .card-content { padding: 25px; }
        .card-icon { font-size: 2rem; margin-bottom: 15px; display: inline-block; }
        .card-title { font-family: var(--font-heading); font-size: 1.4rem; font-weight: 700; margin-bottom: 8px; }
        .card-issuer { color: var(--text-dark); font-weight: 600; margin-bottom: 15px; font-size: 0.9rem; }
        .card-description { line-height: 1.6; color: var(--text-light); font-size: 1rem; }
        .card-red .card-icon, .card-red .card-title { color: var(--primary-red); }
        .card-blue .card-icon, .card-blue .card-title { color: var(--primary-blue); }

        /* Modal (Lightbox) */
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.85); animation: fadeIn 0.5s; }
        .modal-content { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0.9); max-width: 90vw; max-height: 90vh; animation: zoomIn 0.5s forwards; }
        .close-btn { position: absolute; top: 20px; right: 35px; color: #f1f1f1; font-size: 40px; font-weight: bold; transition: 0.3s; cursor: pointer; }
        .close-btn:hover, .close-btn:focus { color: #bbb; }
        @keyframes fadeIn { from {opacity: 0;} to {opacity: 1;} }
        @keyframes fadeOut { from {opacity: 1;} to {opacity: 0;} }
        @keyframes zoomIn { from {transform: translate(-50%, -50%) scale(0.9);} to {transform: translate(-50%, -50%) scale(1);} }
        @keyframes zoomOut { from {transform: translate(-50%, -50%) scale(1);} to {transform: translate(-50%, -50%) scale(0.9);} }

        /* Responsive */
        @media screen and (max-width: 768px) {
            .main-title { font-size: 2.5rem; margin-bottom: 50px; }
            .timeline-container { display: none; }
            .timeline-list-mobile { display: block; }
            .timeline-item-mobile {
                position: relative;
                width: 100%;
                opacity: 0;
                transform: translateX(-30px);
                transition: opacity 0.6s ease-out, transform 0.6s ease-out;
                margin-bottom: 30px;
            }
            .timeline-item-mobile.is-visible { opacity: 1; transform: translateX(0); }
        }
        @media screen and (min-width: 769px) {
            .timeline-list-mobile { display: none; }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1 class="main-title">DÒNG THỜI GIAN THÀNH TÍCH</h1>
        
        <div class="timeline-container">
            <div class="timeline-grid" id="timeline-desktop-content"></div>
            <div class="timeline-svg-wrapper">
                <svg class="timeline-svg"><path id="timeline-path" d=""></path></svg>
                <div id="timeline-nodes-container"></div>
            </div>
        </div>

        <div class="timeline-list-mobile" id="timeline-mobile-content"></div>
    </div>

    <!-- Modal Structure --><div id="imageModal" class="modal">
        <span class="close-btn">&times;</span>
        <img class="modal-content" id="modalImage">
    </div>

    <script>
        const achievementsData = [
            { type: 'red', image: 'https://images.unsplash.com/photo-1517694712202-14dd9538aa97?q=80&w=1470&auto=format&fit=crop', alt: 'Giải Vàng Sáng Tạo Web', icon: 'fa-trophy', title: 'Giải Vàng Sáng Tạo Web', issuer: 'Tổ chức Tech Innovation - 2024', description: 'Đạt giải nhất trong cuộc thi phát triển ứng dụng web với dự án "ConnectMe".' },
            { type: 'blue', image: 'https://images.unsplash.com/photo-1605379399642-870262d3d051?q=80&w=1506&auto-format&fit=crop', alt: 'Chứng chỉ AWS Cloud', icon: 'fa-certificate', title: 'Certified Cloud Practitioner', issuer: 'Amazon Web Services (AWS) - 2023', description: 'Chứng minh kiến thức toàn diện về cơ sở hạ tầng và dịch vụ đám mây của AWS.' },
            { type: 'red', image: 'https://images.unsplash.com/photo-1550745165-9bc0b252726a?q=80&w=1470&auto-format&fit=crop', alt: 'Top 5 Hackathon', icon: 'fa-medal', title: 'Top 5 Hackathon Quốc Gia', issuer: 'Vietnam AI Hackathon - 2023', description: 'Giải pháp ứng dụng AI để phân tích và dự báo chất lượng không khí tại các đô thị lớn.' },
            { type: 'blue', image: 'https://images.unsplash.com/photo-1542744173-8e7e53415bb0?q=80&w=1470&auto-format&fit=crop', alt: 'Chứng chỉ Scrum Master', icon: 'fa-cogs', title: 'Professional Scrum Master I', issuer: 'Scrum.org - 2022', description: 'Nắm vững các nguyên tắc và giá trị của Scrum, dẫn dắt đội nhóm hiệu quả.' }
        ];

        function createAchievementCardHTML(item) {
            return `
                <div class="achievement-card">
                    <div class="card-image-wrapper">
                        <img src="${item.image}" alt="${item.alt}" class="card-image" onerror="this.onerror=null;this.src='https://placehold.co/600x400/2a2a2e/f0f0f0?text=Image+Not+Found';">
                        <button class="preview-btn" data-img-src="${item.image}"><i class="fas fa-expand"></i></button>
                    </div>
                    <div class="card-content">
                        <i class="card-icon fas ${item.icon}"></i>
                        <h3 class="card-title">${item.title}</h3>
                        <p class="card-issuer">${item.issuer}</p>
                        <p class="card-description">${item.description}</p>
                    </div>
                </div>
            `;
        }

        document.addEventListener("DOMContentLoaded", function() {
            const gridContainer = document.getElementById('timeline-desktop-content');
            const mobileContainer = document.getElementById('timeline-mobile-content');
            const nodesContainer = document.getElementById('timeline-nodes-container');
            const path = document.getElementById("timeline-path");

            // Populate Grid and Mobile List
            achievementsData.forEach((item, index) => {
                const isLeft = index % 2 === 0;
                const desktopItem = document.createElement('div');
                desktopItem.className = `timeline-item card-${item.type} ${isLeft ? 'left' : 'right'}`;
                desktopItem.innerHTML = createAchievementCardHTML(item);
                gridContainer.appendChild(desktopItem);

                const mobileItem = document.createElement('div');
                mobileItem.className = `timeline-item-mobile card-${item.type}`;
                mobileItem.innerHTML = createAchievementCardHTML(item);
                mobileContainer.appendChild(mobileItem);
            });

            // Intersection Observer for fade-in effect
            const timelineItems = document.querySelectorAll('.timeline-item, .timeline-item-mobile');
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.classList.add('is-visible');
                        observer.unobserve(entry.target);
                    }
                });
            }, { threshold: 0.2 });
            timelineItems.forEach(item => observer.observe(item));

            // Modal Logic
            const modal = document.getElementById("imageModal");
            const modalImg = document.getElementById("modalImage");
            const closeBtn = document.querySelector(".close-btn");

            document.querySelectorAll('.preview-btn').forEach(button => {
                button.onclick = function() {
                    modal.style.display = "block"; modal.style.animation = "fadeIn 0.5s";
                    modalImg.src = this.getAttribute('data-img-src');
                    modalImg.style.animation = "zoomIn 0.5s forwards";
                }
            });

            const closeModal = () => {
                modalImg.style.animation = "zoomOut 0.4s forwards";
                modal.style.animation = "fadeOut 0.4s forwards";
                setTimeout(() => { modal.style.display = "none"; }, 400);
            }
            closeBtn.onclick = closeModal;
            modal.onclick = (event) => { if(event.target === modal) closeModal(); }

            function setupTimelineAnimation() {
                if (window.innerWidth <= 768) return;

                const items = Array.from(gridContainer.children);
                const title = document.querySelector('.main-title');

                nodesContainer.innerHTML = '';
                const nodeElements = [];
                const nodePoints = []; // Stores {x, y} relative to timeline-container for path drawing

                // Get the bounding rect of the grid container once
                const gridRect = gridContainer.getBoundingClientRect();

                items.forEach((item, index) => {
                    const node = document.createElement('div');
                    node.className = `timeline-node node-${achievementsData[index].type}`;
                    nodesContainer.appendChild(node);
                    nodeElements.push(node);
                    
                    const cardRect = item.getBoundingClientRect();
                    
                    let nodeX; // X-coordinate relative to timeline-container
                    const centerGutterX = (gridRect.width / 2); // Center of the grid relative to gridContainer
                    const halfGutterWidth = 150 / 2; // Half of the 150px gutter width

                    if (item.classList.contains('left')) {
                        nodeX = centerGutterX + halfGutterWidth; // Node is on the right edge of left card / left edge of gutter
                    } else { // isRight
                        nodeX = centerGutterX - halfGutterWidth; // Node is on the left edge of right card / right edge of gutter
                    }

                    const nodeY = (cardRect.top - gridRect.top) + cardRect.height / 2;
                    
                    // Position the actual DOM node
                    node.style.left = `${nodeX - node.offsetWidth / 2}px`;
                    node.style.top = `${nodeY - node.offsetHeight / 2}px`;

                    nodePoints.push({ x: nodeX, y: nodeY });
                });

                // Generate SVG Path
                const titleRect = title.getBoundingClientRect();
                const startX = gridContainer.offsetWidth / 2; // Start from center of grid
                const startY = (titleRect.bottom - gridRect.top) + 40; // 40px below title

                let pathD = `M ${startX} ${startY}`;
                
                // Add the initial straight line segment to the first node's X position
                pathD += ` L ${nodePoints[0].x} ${nodePoints[0].y}`;

                for (let i = 0; i < nodePoints.length - 1; i++) {
                    const p0 = nodePoints[i];
                    const p1 = nodePoints[i + 1];
                    
                    const midY = (p0.y + p1.y) / 2;

                    // For S-curve, control points are shifted horizontally
                    const cp1x = (i % 2 === 0) ? p0.x + (Math.abs(p1.x - p0.x) * 0.8) : p0.x - (Math.abs(p1.x - p0.x) * 0.8);
                    const cp2x = (i % 2 === 0) ? p1.x + (Math.abs(p1.x - p0.x) * 0.8) : p1.x - (Math.abs(p1.x - p0.x) * 0.8);

                    pathD += ` C ${cp1x} ${midY}, ${cp2x} ${midY}, ${p1.x} ${p1.y}`;
                }
                path.setAttribute('d', pathD);

                // Setup scroll animation
                const pathLength = path.getTotalLength();
                path.style.strokeDasharray = pathLength;
                path.style.strokeDashoffset = pathLength;
                
                let ticking = false;

                function updateOnScroll() {
                    const containerRect = gridContainer.getBoundingClientRect();
                    const startAnimationAt = window.innerHeight * 0.8; // Start when 80% of viewport from bottom
                    const endAnimationAt = window.innerHeight * 0.2; // End when 20% of viewport from top
                    
                    let scrollYRelativeToContainer = startAnimationAt - containerRect.top;
                    let totalScrollDistance = (containerRect.height - (startAnimationAt - endAnimationAt));
                    
                    let progress = scrollYRelativeToContainer / totalScrollDistance;
                    progress = Math.max(0, Math.min(1, progress));

                    const drawLength = pathLength * progress;
                    path.style.strokeDashoffset = pathLength - drawLength;
                    
                    // Activate nodes based on progress
                    const activeNodeIndex = Math.floor(progress * (nodeElements.length - 0.001));
                    nodeElements.forEach((node, index) => {
                        if (index <= activeNodeIndex) {
                            node.classList.add('active');
                        } else {
                            node.classList.remove('active');
                        }
                    });

                    ticking = false;
                }

                function onScroll() {
                    if (!ticking) {
                        window.requestAnimationFrame(updateOnScroll);
                        ticking = true;
                    }
                }

                window.addEventListener('scroll', onScroll, { passive: true });
                updateOnScroll();
            }
            
            // Re-run animation setup on load and resize
            window.onload = function() {
                setupTimelineAnimation();
            };

            window.addEventListener('resize', () => {
                clearTimeout(window.resizedFinished);
                window.resizedFinished = setTimeout(setupTimelineAnimation, 250);
            });
        });

    </script>
</body>
</html>
